# Publishes the package on npm when a release is published on GitHub. The
# tests run first, and the seal tests validated by DSS (dss.yml): nothing
# is published unless both pass. npm trusts this workflow (trusted
# publishing, set up in the settings of the package on npmjs.com for
# webcoder31/ezxmldsig-js and publish.yml): it proves its identity with an
# OpenID Connect token of GitHub (permission id-token), without any npm
# token, and npm adds the provenance of the package (this workflow, the
# commit it was built from).
# Requires npm 11.5.1 or later, and a public repository.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dss:
    uses: ./.github/workflows/dss.yml

  publish:
    needs: dss
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # The version published is that of package.json: a release whose tag
      # is not v<that version> would publish another one than it names.
      - name: The tag of the release is v<version of package.json>
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME is not $expected, the version of package.json: nothing is published." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
